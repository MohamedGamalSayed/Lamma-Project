<!DOCTYPE html>
<html>
<head>
  <title>Chat Test Client</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
    input, button, textarea { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    #messages { border: 1px solid #ccc; height: 250px; overflow-y: auto; padding: 10px; margin-top: 10px; }
    .msg { margin-bottom: 6px; }
    .msg b { color: #4a4a8a; }
    #log { color: #888; font-size: 12px; white-space: pre-wrap; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Chat Test Client (Week 3 debug page — not the real frontend)</h2>

  <label>1. Paste your JWT token (from login):</label>
  <input id="token" placeholder="eyJhbGciOi..." />

  <label>2. Channel ID to join:</label>
  <input id="channelId" placeholder="1" value="1" />
  <button onclick="connectAndJoin()">Connect & Join Channel</button>

  <div id="messages"></div>

  <label>3. Message:</label>
  <input id="messageInput" placeholder="Type a message and press Enter" onkeydown="if(event.key==='Enter') sendMessage()" />
  <button onclick="sendMessage()">Send</button>

  <div id="log"></div>

  <script>
    let socket = null;
    const log = (text) => {
      document.getElementById('log').textContent += text + '\n';
    };

    function connectAndJoin() {
      const token = document.getElementById('token').value.trim();
      const channelId = document.getElementById('channelId').value.trim();

      if (!token) { alert('paste your token first'); return; }

      // Change this URL if your backend runs somewhere other than localhost:5000
      socket = io('http://localhost:5000', {
        auth: { token }
      });

      socket.on('connect', () => {
        log('Connected. Socket ID: ' + socket.id);
        socket.emit('join_channel', channelId);
        log('Joined channel ' + channelId);
      });

      socket.on('connect_error', (err) => {
        log('Connection error: ' + err.message);
      });

      socket.on('new_message', (message) => {
        const div = document.getElementById('messages');
        const p = document.createElement('div');
        p.className = 'msg';
        p.innerHTML = '<b>' + message.username + ':</b> ' + message.content;
        div.appendChild(p);
        div.scrollTop = div.scrollHeight;
      });

      socket.on('message_error', (err) => {
        log('Message error: ' + err.error);
      });
    }

    function sendMessage() {
      const channelId = document.getElementById('channelId').value.trim();
      const input = document.getElementById('messageInput');
      const content = input.value.trim();
      if (!content || !socket) return;

      socket.emit('send_message', { channelId, content });
      input.value = '';
    }
  </script>
</body>
</html>
